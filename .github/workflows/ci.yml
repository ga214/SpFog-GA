name: CI

# Minden push és pull request ellenőrzése: linter, formázás, tesztek.
#
# A CI SOHA nem használ titkot. Ha egy teszthez hálózat vagy adatbázis
# kellene, az `halozat` markert kapja, és a CI kihagyja. Így a CI akkor is
# lefut, ha egy külső szolgáltatás éppen elérhetetlen.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ellenorzes:
    name: Lint és tesztek
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Repó letöltése
        uses: actions/checkout@v4

      - name: uv telepítése
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Python és függőségek
        run: uv sync --frozen --extra dev

      - name: Linter
        run: uv run ruff check .

      - name: Formázás ellenőrzése
        run: uv run ruff format --check .

      - name: Konfiguráció validálása
        run: uv run tippmix config-ellenorzes

      - name: Tesztek
        # A hálózatot igénylő teszteket kihagyjuk — a CI ne bukjon el egy
        # külső szolgáltatás kiesésén.
        run: uv run pytest -m "not halozat" --cov=tippmix --cov-report=term-missing

  titok-szures:
    name: Titok-szűrés
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repó letöltése
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        # A repó PUBLIKUS. Egy véletlenül commitolt kulcs azonnal
        # kompromittált. Ez a lépés minden commitot átvizsgál.
        #
        # A gitleaks/gitleaks-action a push esemény before/after SHA-jából
        # próbálja kitalálni a vizsgálandó tartományt. Az ELSŐ push-nál a
        # "before" SHA nem valós referencia ("ambiguous argument"), és az
        # action erre hibával áll le — nem azért, mert titkot talált, hanem
        # mert nincs mihez képest diffelnie. Ezért a gitleaks CLI-t közvetlenül
        # hívjuk, és mindig a teljes checkoutolt historyt vizsgáljuk
        # (--log-opts nélkül), ami minden esetben — első push-nál is — helyes.
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --redact -v --exit-code=2
