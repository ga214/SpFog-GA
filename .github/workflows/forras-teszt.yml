name: Adatforrás-teszt (fejlesztői)

# Megnézi, elérhető-e egy-egy külső sportadat-forrás a runnerről.
# A fejlesztő céges hálózatáról néhány forrás (pl. api.clubelo.com) nem
# érhető el — ez eldönti, hogy a forrás halott-e, vagy csak a proxy blokkol.
#
# Csak olvas, nem kell hozzá titok. Kézzel indítandó.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  teszt:
    name: Források elérhetősége
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Repó letöltése
        uses: actions/checkout@v4

      - name: uv telepítése
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Python és függőségek
        run: uv sync --frozen

      - name: Források tesztelése
        run: uv run python scripts/forras_teszt.py
