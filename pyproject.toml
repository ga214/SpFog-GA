[project]
name = "tippmix-tipprendszer"
version = "0.1.0"
description = "Automatizált sportfogadási tipprendszer Tippmix Pro-ra"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    # --- Adatfeldolgozás ---
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",      # izotonikus regresszió a kalibrációhoz (6. lépés)
    "pyarrow>=16.0",          # Parquet-cache a backteszthez

    # --- Konfiguráció ---
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pydantic>=2.7",          # a settings.yaml séma-validálásához

    # --- Adatforrások ---
    "soccerdata>=1.8",        # FBref, Understat, ClubElo, football-data.co.uk wrapper
    # A soccerdata egyik tranzitív függősége (undetected-chromedriver) a
    # `distutils`-t importálja, amit a Python 3.12 eltávolított. A setuptools
    # visszaadja. Enélkül a soccerdata SEMMILYEN almodulja nem importálható.
    "setuptools>=69.0",
    "understatapi>=0.7",      # xG 2014/15-től
    "nba_api>=1.4",           # NBA statisztika (FIGYELEM: adatközponti IP-t blokkolhat)
    "euroleague-api>=0.1",    # EuroLeague / EuroCup

    # --- Scraping ---
    "httpx>=0.27",            # elsődleges: sports2.tippmixpro.hu JSON-végpont
    "playwright>=1.44",       # tartalék: ha a JSON-végpont JS-t igényel

    # --- Névillesztés ---
    "rapidfuzz>=3.9",

    # --- Adattár ---
    "supabase>=2.5",

    # --- Naplózás ---
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
tippmix = "tippmix.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tippmix"]

# ---------------------------------------------------------------------------
# Ruff — linter és formatter egyben
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle hibák
    "W",    # pycodestyle figyelmeztetések
    "F",    # pyflakes
    "I",    # import-rendezés (isort)
    "B",    # bugbear — gyakori hibaminták
    "UP",   # pyupgrade
    "C4",   # comprehension-egyszerűsítés
    "SIM",  # egyszerűsíthető kód
    "ARG",  # nem használt argumentum
    "PTH",  # pathlib használata os.path helyett
    "RUF",  # ruff-specifikus
]
ignore = [
    "E501",    # sorhossz — a formatter kezeli
    "RUF001",  # ékezetes karakterek a stringekben (magyar szövegek)
    "RUF002",  # ugyanez a docstringekben
    "RUF003",  # ugyanez a kommentekben
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]   # a pytest fixture-ök gyakran "nem használtak"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"
markers = [
    "smoke: gyors füstteszt, a pipeline összeállását ellenőrzi",
    "halozat: külső hálózatot igénylő teszt (alapból kihagyva)",
]
